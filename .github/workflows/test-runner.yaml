name: Game Test Suite
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang \
            libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri

      - name: cache CMake FetchContent (raylib, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-clang-${{ hashFiles('CMakeLists.txt') }}

      - name: configure CMake
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: build tests
        run: cmake --build build --target tests

      - name: run test suite
        # test_game builds a hidden raylib window (needed for texture loads), which
        # requires a GL context. The headless runner has no display, so provide a
        # virtual one via xvfb and force Mesa software rendering (no GPU on CI).
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" ./build/tests --reporter console::out=- --reporter JUnit::out=test-results.xml

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
